name: Build

# Bouwt alles uit één commit en bewaart het als artifacts bij de run:
#   - de ondertekende installers (desktop-ondertekend.yml): Windows (per machine
#     en per gebruiker), macOS (universele .dmg) en Linux (.deb en .AppImage)
#   - de rekenkern als npm-pakket (@ifc-calc/core)
# De controles (npm run check) draaien ernaast. Hier wordt niets gepubliceerd;
# releases komen uit release.yml (v*-tags) en nightly.yml (main). Dit is daarom ook
# de plek om de ondertekening op een eigen tak te proberen.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Een deel van de controles importeert TypeScript uit packages/desktop
      # rechtstreeks; dat vraagt de ingebouwde type-stripping van Node 24.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      - name: Run checks
        run: npm run check

  desktop:
    uses: ./.github/workflows/desktop-ondertekend.yml
    with:
      rust-cache: true
    secrets: inherit

  core:
    name: Core package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      - name: Pack core package
        run: |
          mkdir -p pakket
          npm pack --workspace=@ifc-calc/core --pack-destination pakket

      - name: Upload core package
        uses: actions/upload-artifact@v5
        with:
          name: ifc-calc-core
          path: pakket/*.tgz
          if-no-files-found: error
