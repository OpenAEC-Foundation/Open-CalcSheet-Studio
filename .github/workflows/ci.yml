name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  # Snel antwoord, zonder install: gelijke versievelden en de regels voor de
  # Windows-installer. Beide draaien ook mee in checks.
  versie-uitlevering:
    name: Versie en uitlevering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Controleer het versienummer
        run: node scripts/check-versie.mjs

      - name: Controleer de uitlevering
        run: node scripts/check-uitlevering.mjs

  # Alle controles, op Linux en op Windows met CRLF in de werkkopie. Op Windows wordt
  # ontwikkeld; een fout die alleen bij CRLF optreedt, ziet de Linux-job niet.
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      # Vóór de checkout, en niet uitgaan van de standaard van de runner.
      - name: Zet CRLF aan (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v6

      # Een deel van de controles importeert TypeScript uit packages/desktop
      # rechtstreeks; dat vraagt de ingebouwde type-stripping van Node 24.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Controleer de CRLF in de werkkopie (Windows)
        if: runner.os == 'Windows'
        run: node scripts/werkkopie-crlf.mjs

      - name: Install workspace dependencies
        run: npm install

      - name: Run checks
        run: npm run check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: npm install

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      - name: Build Tauri app
        working-directory: packages/desktop
        run: npm run tauri build -- --no-bundle

      # De beveiligingstests van de ERPNext-koppeling (adres, herkomst, doorverwijzing);
      # de test met de echte sleutelbos is #[ignore] en blijft overgeslagen.
      - name: Test de ERPNext-koppeling (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib erpnext

      # De brug naar Open FEM Studio: protocol en procesbeheer, zonder Tauri en dus ook
      # op Windows. De proeven met de echte server zijn #[ignore] (geen FEM Studio op de runner).
      - name: Test de brug naar FEM Studio
        run: cargo test --manifest-path packages/desktop/src-tauri/fem-brug/Cargo.toml
